name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"
  PYTHON_VERSION: "3.11"

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|test|chore|refactor|ci|build|perf|style)\((backend|ml|cv|frontend|deploy|docs|data|repo)\)(: .+)?$' \
            || { echo "PR title must look like 'feat(backend): short text'"; exit 1; }

  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scamradar
          POSTGRES_PASSWORD: scamradar
          POSTGRES_DB: scamradar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scamradar" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/dev.txt
      - name: Lint
        run: |
          ruff check . ../data/tools ../docs/pdf
          ruff format --check . ../data/tools ../docs/pdf
      - name: Migrations on PostgreSQL
        env:
          SCAMRADAR_DATABASE_URL: postgresql+psycopg://scamradar:scamradar@localhost:5432/scamradar
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Cache Whisper and OCR models
        uses: actions/cache@v4
        with:
          path: ~/model_cache
          key: models-whisper-base-easyocr-ru-en-v1
      - name: Tests with coverage
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
          TEST_MODEL_CACHE_DIR: /home/runner/model_cache
          HF_HOME: /home/runner/model_cache/huggingface
        run: pytest --cov --cov-report=term --cov-report=xml --cov-report=html -p no:cacheprovider
      - name: OpenAPI schema is up to date
        run: |
          python scripts/export_openapi.py ../frontend/test/contract/openapi.json
          git diff --exit-code ../frontend/test/contract/openapi.json \
            || { echo "Run python backend/scripts/export_openapi.py frontend/test/contract/openapi.json and commit"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/htmlcov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Format
        run: dart format --output=none --set-exit-if-changed -l 120 lib test integration_test
      - name: Unit, widget and contract tests
        run: flutter test --coverage
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          install-chromedriver: true
      - name: Integration tests in headless Chrome
        run: |
          chromedriver --port=4444 &
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart \
            -d web-server --browser-name=chrome --headless
      - name: Build web
        run: flutter build web --release --dart-define-from-file=env/prod.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Android APK and AAB
        run: |
          flutter build apk --release --dart-define-from-file=env/prod.json
          flutter build appbundle --release --dart-define-from-file=env/prod.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            frontend/build/app/outputs/flutter-apk/app-release.apk
            frontend/build/app/outputs/bundle/release/app-release.aab

  android-integration:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: frontend
          script: flutter test integration_test/app_test.dart -d emulator-5554

  ios-build:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign --dart-define-from-file=env/prod.json

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 120); do
            if curl -fsS http://localhost:8080/api/v1/health | grep -q '"worker":true'; then break; fi
            sleep 10
          done
          curl -fsS http://localhost:8080/api/v1/health
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        working-directory: e2e
        run: npx playwright test
      - name: Click-through crawler
        working-directory: e2e
        run: node crawler.mjs
      - name: Stack logs
        if: always()
        run: docker compose logs --no-color > e2e/stack.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            e2e/screenshots
            e2e/report
            e2e/stack.log
