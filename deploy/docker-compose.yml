name: scamradar

x-backend-env: &backend-env
  SCAMRADAR_ENV: ${SCAMRADAR_ENV:-local}
  SCAMRADAR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scamradar}:${POSTGRES_PASSWORD:-scamradar}@postgres:5432/${POSTGRES_DB:-scamradar}
  SCAMRADAR_REDIS_URL: redis://redis:6379/0
  SCAMRADAR_SECRET_KEY: ${SCAMRADAR_SECRET_KEY:-local-development-secret-key-change-me-0123456789}
  SCAMRADAR_CORS_ORIGINS: ${SCAMRADAR_CORS_ORIGINS:-["http://localhost:8080", "http://localhost:8091"]}
  SCAMRADAR_TRUST_PROXY_HEADERS: "true"
  SCAMRADAR_ADMIN_EMAIL: ${SCAMRADAR_ADMIN_EMAIL:-admin@example.com}
  SCAMRADAR_ADMIN_PASSWORD: ${SCAMRADAR_ADMIN_PASSWORD:-admin-password-change-me}
  SCAMRADAR_WHISPER_MODEL_SIZE: ${SCAMRADAR_WHISPER_MODEL_SIZE:-base}
  SCAMRADAR_RATE_LIMIT_ANONYMOUS_PER_HOUR: ${SCAMRADAR_RATE_LIMIT_ANONYMOUS_PER_HOUR:-30}
  SCAMRADAR_VIDEO_RETENTION_HOURS: ${SCAMRADAR_VIDEO_RETENTION_HOURS:-0}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scamradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scamradar}
      POSTGRES_DB: ${POSTGRES_DB:-scamradar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../backend
      args:
        REQUIREMENTS: prod.txt
    image: scamradar-backend:local
    command: ["api"]
    environment: *backend-env
    volumes:
      - media:/data/media
      - logs:/data/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: scamradar-backend:local
    command: ["worker"]
    environment: *backend-env
    volumes:
      - media:/data/media
      - logs:/data/logs
      - models:/models
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 60s
      timeout: 20s
      start_period: 600s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ../frontend
      args:
        APP_ENV: ${APP_ENV:-local}
        API_BASE_URL: ""
    image: scamradar-web:local
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
  logs:
  models:
